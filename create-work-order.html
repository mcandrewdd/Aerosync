<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AeroSync | Create Work Order</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#020914;--panel:#061827;--line:#1b5278;--text:#f5f9fc;--muted:#9db6ca;--blue:#24b7ff;--green:#39dc98}*{box-sizing:border-box}body{margin:0;background:#020914;color:var(--text);font-family:Segoe UI,Arial}.app{max-width:1050px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;border-bottom:1px solid #174563;padding-bottom:14px}.brand{font-size:28px;font-weight:900}.brand span{color:var(--blue)}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}.input,textarea{width:100%;border:1px solid #1c597f;background:#03131f;color:#fff;border-radius:9px;padding:12px}.input{height:49px}textarea{min-height:95px}.btn{border:1px solid #2285b9;background:#092239;color:#fff;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#087fd3}.success{background:#20b979;color:#011;border:0}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:15px}.status{padding:10px;color:#9fe3ff}.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr auto;gap:12px;background:#04131f;border:1px solid #143f59;border-radius:10px;padding:14px}.muted{color:var(--muted);font-size:13px}.pill{color:#aaf3d0;font-size:11px;margin-left:8px}.search{display:grid;grid-template-columns:1fr auto;gap:10px}label{display:block;margin:8px 0 5px;font-size:13px;font-weight:700}@media(max-width:650px){.grid,.row,.search{grid-template-columns:1fr}.actions{flex-direction:column}}</style></head><body><main class="app"><header class="top"><div class="brand">Aero<span>Sync</span></div><div><button class="btn" onclick="location.href='dashboard.html'">DASHBOARD</button></div></header><section class="card"><h1>Create Work Order</h1><p class="muted">Use the maintenance shop's own work-order number. AeroSync links the aircraft and creates the scannable work-order identifier.</p><div class="grid"><div><label>Work Order Number *</label><input class="input" id="wo"></div><div><label>Maintenance Type</label><input class="input" id="maint"></div><div class="full"><label>Description *</label><input class="input" id="desc"></div><div><label>Scheduled Date</label><input class="input" id="sched" type="date"></div><div><label>Due Date / Time</label><input class="input" id="due" type="datetime-local"></div><div class="full"><label>Notes</label><textarea id="notes"></textarea></div><div><label>Tail Number *</label><input class="input" id="tail"></div><div><label>Serial Number</label><input class="input" id="serial"></div><div><label>Manufacturer</label><input class="input" id="mfr"></div><div><label>Model</label><input class="input" id="model"></div><div><label>Aircraft Type</label><input class="input" id="atype"></div><div><label>Operator</label><input class="input" id="operator"></div><div><label>Home Location</label><input class="input" id="home"></div></div><div id="formStatus" class="status"></div><div class="actions"><button class="btn primary" id="lookup">LOOK UP AIRCRAFT</button><button class="btn success" id="create">CREATE WORK ORDER</button></div></section><section class="card"><h2>Active Work Orders</h2><p class="muted">Reprint a parts-room scan sheet anytime for open and in-progress work orders.</p><div class="search"><input class="input" id="search" placeholder="Search work order or aircraft tail number"><button class="btn" id="refresh">REFRESH</button></div><div id="activeStatus" class="status"></div><div id="list" class="list"></div></section></main><script>const URL='https://sxucjoqqitqyjlqhmlbj.supabase.co',KEY='sb_publishable_qIznWgrUU58mETYnKnV_BA_6b_uDl6a',sb=supabase.createClient(URL,KEY),db=()=>sb.schema('aerosync'),$=id=>document.getElementById(id);let profile=null,orders=[];const v=id=>$(id).value.trim();function message(id,t){$(id).textContent=t||''}async function init(){const{data:{session}}=await sb.auth.getSession();if(!session)return location.replace('index.html');const{data,error}=await db().from('profiles').select('id,active,organization_id').eq('id',session.user.id).single();if(error||!data?.active||!data.organization_id)return location.replace('index.html');profile=data;await load()}async function lookup(){const tail=v('tail').toUpperCase().replace(/[^A-Z0-9]/g,'');$('tail').value=tail;if(!tail)return message('formStatus','Enter a tail number.');const{data,error}=await db().from('aircraft').select('*').eq('organization_id',profile.organization_id).ilike('tail_number',tail).limit(1);if(error)return message('formStatus',error.message);if(data?.length){const a=data[0];$('serial').value=a.serial_number||'';$('mfr').value=a.manufacturer||'';$('model').value=a.model||'';$('atype').value=a.aircraft_type||'';$('operator').value=a.operator_name||'';$('home').value=a.home_location||'';message('formStatus','Existing aircraft found.')}else message('formStatus','New aircraft. Complete aircraft information before creating the work order.')}async function create(){if(!v('wo')||!v('tail')||!v('desc'))return message('formStatus','Work Order Number, Description, and Tail Number are required.');let due=$('due').value?new Date($('due').value).toISOString():null;const{data,error}=await db().rpc('create_work_order',{p_work_order_number:v('wo'),p_tail_number:v('tail'),p_serial_number:v('serial')||null,p_manufacturer:v('mfr')||null,p_model:v('model')||null,p_aircraft_type:v('atype')||null,p_operator_name:v('operator')||null,p_home_location:v('home')||null,p_maintenance_type:v('maint')||null,p_description:v('desc'),p_scheduled_date:$('sched').value||null,p_due_at:due,p_notes:v('notes')||null});if(error)return message('formStatus',error.message);const r=Array.isArray(data)?data[0]:data;message('formStatus','Work order created successfully.');if(r?.work_order_id) location.href='work-order-print.html?id='+encodeURIComponent(r.work_order_id)}async function load(){message('activeStatus','Loading active work orders...');const{data,error}=await db().from('work_orders').select('id,work_order_number,description,status,opened_at,aircraft_id').eq('organization_id',profile.organization_id).in('status',['open','in_progress']).order('opened_at',{ascending:false});if(error)return message('activeStatus',error.message);const ids=[...new Set((data||[]).map(x=>x.aircraft_id).filter(Boolean))],map={};if(ids.length){const{data:a}=await db().from('aircraft').select('id,tail_number,manufacturer,model').in('id',ids);(a||[]).forEach(x=>map[x.id]=x)}orders=(data||[]).map(x=>({...x,aircraft:map[x.aircraft_id]}));message('activeStatus',orders.length+' active work order'+(orders.length===1?'':'s')+' available.');render()}function render(){const q=v('search').toLowerCase();const rows=orders.filter(w=>!q||(w.work_order_number||'').toLowerCase().includes(q)||(w.aircraft?.tail_number||'').toLowerCase().includes(q));$('list').innerHTML=rows.length?rows.map(w=>'<div class="row"><div><b>'+w.work_order_number+'</b><span class="pill">'+w.status.toUpperCase().replace('_',' ')+'</span><div class="muted">Aircraft: '+(w.aircraft?.tail_number||'—')+' · '+(w.description||'No description')+'</div></div><button class="btn primary" onclick="printWO(''+w.id+'')">PRINT SCAN SHEET</button></div>').join(''):'<div class="muted">No active work orders match this search.</div>'}function printWO(id){location.href='work-order-print.html?id='+encodeURIComponent(id)}$('lookup').onclick=lookup;$('create').onclick=create;$('refresh').onclick=load;$('search').oninput=render;init();</script></body></html>
